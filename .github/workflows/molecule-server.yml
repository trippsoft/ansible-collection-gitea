---
name: Molecule - server role
'on':
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    paths:
      - galaxy.yml
      - roles/server/**
      - '!roles/server/.aar_doc.yml'
      - '!roles/server/README.md'
      - '!roles/server/meta/argument_specs.yml'
      - '!roles/server/meta/main.yml'
  push:
    branches:
      - main
    paths:
      - galaxy.yml
      - roles/server/**
      - '!roles/server/.aar_doc.yml'
      - '!roles/server/README.md'
      - '!roles/server/meta/argument_specs.yml'
      - '!roles/server/meta/main.yml'
defaults:
  run:
    working-directory: 'trippsc2.gitea'
jobs:
  molecule_default:
    name: Run Molecule tests - No reverse proxy
    runs-on:
      - self-hosted
      - linux
      - ansible
      - x64
    strategy:
      fail-fast: false
      matrix:
        box:
          - debian13_base
          - rocky8_cis
          - rocky9_cis
          - rocky10_base
          - ubuntu2204_base
          - ubuntu2404_base
          - ubuntu2604_base
        ansible:
          - '2.16'
          - '2.21'
        exclude:
          - box: rocky8_cis
            ansible: '2.21'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: 'trippsc2.gitea'
      - name: Run Molecule tests
        run: |
          source ~/venv/ansible-${{ matrix.ansible }}/bin/activate
          rm -rf ~/.ansible/collections/ansible_collections/*
          cd ./roles/server
          molecule test
          rm -rf ~/.ansible/collections/ansible_collections/*
          deactivate
        env:
          ANSIBLE_FORCE_COLOR: '1'
          PY_COLORS: '1'
          MOLECULE_BOX: ${{ matrix.box }}
          MOLECULE_ANSIBLE_VERSION: ${{ matrix.ansible }}
  molecule_reverse_proxy:
    name: Run Molecule tests - Nginx reverse proxy
    runs-on:
      - self-hosted
      - linux
      - ansible
      - x64
    strategy:
      fail-fast: false
      matrix:
        box:
          - debian13_base
          - rocky8_cis
          - rocky9_cis
          - rocky10_base
          - ubuntu2204_base
          - ubuntu2404_base
          - ubuntu2604_base
        ansible:
          - '2.16'
          - '2.21'
        exclude:
          - box: rocky8_cis
            ansible: '2.21'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: 'trippsc2.gitea'
      - name: Run Molecule tests
        run: |
          source ~/venv/ansible-${{ matrix.ansible }}/bin/activate
          rm -rf ~/.ansible/collections/ansible_collections/*
          cd ./roles/server
          molecule test -s reverse_proxy
          rm -rf ~/.ansible/collections/ansible_collections/*
          deactivate
        env:
          ANSIBLE_FORCE_COLOR: '1'
          PY_COLORS: '1'
          MOLECULE_BOX: ${{ matrix.box }}
          MOLECULE_ANSIBLE_VERSION: ${{ matrix.ansible }}
